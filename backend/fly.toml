app = "taxassist-backend"
primary_region = "sin"  # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # Never sleep — key difference from Render free
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"       # Free tier VM
  memory = "256mb"
